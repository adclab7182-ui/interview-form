<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면접 일정 조율</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --fg: #1a202c;
    --fg-muted: #718096;
    --accent: #2b6cb0;
    --accent-bg: #ebf8ff;
    --ok: #276749;
    --ok-bg: #f0fff4;
    --taken: #9b2c2c;
    --taken-bg: #fff5f5;
    --border: #e2e8f0;
    --r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 1.5rem 1rem 2rem;
  }
  .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

  .hdr {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 1.5rem 1.25rem;
    text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .badge {
    display: inline-block; font-size: .65rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-bg);
    padding: .2rem .65rem; border-radius: 999px; margin-bottom: .75rem;
  }
  .hdr h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .4rem; }
  .hdr p  { font-size: .82rem; color: var(--fg-muted); line-height: 1.7; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .card-ttl {
    font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--fg-muted); padding: .85rem 1.25rem .65rem; border-bottom: 1px solid var(--border);
  }

  .slot {
    display: flex; align-items: center; gap: .75rem;
    padding: .9rem 1.25rem; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; transition: background .1s;
  }
  .slot:last-child { border-bottom: none; }
  .slot.available:hover { background: var(--accent-bg); }
  .slot.selected  { background: var(--accent-bg); }
  .slot.taken     { background: var(--taken-bg); cursor: default; }

  .dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    display: grid; place-items: center; transition: border-color .1s;
  }
  .slot.selected .dot { border-color: var(--accent); }
  .slot.selected .dot::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .slot.taken .dot { border-color: var(--taken); }

  .slot-info { flex: 1; min-width: 0; }
  .slot-label { font-size: .88rem; font-weight: 600; }

  .tag {
    flex-shrink: 0; font-size: .62rem; font-weight: 700; letter-spacing: .04em;
    padding: .2rem .5rem; border-radius: 999px;
  }
  .tag-ok    { background: var(--ok-bg);    color: var(--ok); }
  .tag-sel   { background: var(--accent);   color: #fff; }
  .tag-taken { background: var(--taken-bg); color: var(--taken); }

  .row-msg { padding: 1.5rem 1.25rem; text-align: center; color: var(--fg-muted); font-size: .82rem; line-height: 1.6; }

  .fpad { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: .85rem; }
  .field { display: flex; flex-direction: column; gap: .35rem; }
  .field label { font-size: .72rem; font-weight: 700; color: var(--fg-muted); }
  .field input {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
    padding: .6rem .8rem; font-size: .88rem; color: var(--fg); font-family: inherit;
    transition: border-color .12s;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: .75rem 1rem; font-size: .9rem; font-weight: 700;
    font-family: inherit; cursor: pointer; width: 100%; transition: opacity .15s;
  }
  .btn:hover:not(:disabled) { opacity: .88; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .alert { padding: .65rem .85rem; border-radius: 8px; font-size: .78rem; line-height: 1.5; }
  .alert-ok  { background: var(--ok-bg);    color: var(--ok); }
  .alert-err { background: var(--taken-bg); color: var(--taken); }

  .success { text-align: center; padding: 2rem 1.25rem; }
  .s-icon  { font-size: 2.5rem; margin-bottom: .85rem; }
  .success h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: .5rem; }
  .success p  { font-size: .82rem; color: var(--fg-muted); line-height: 1.7; margin-bottom: 1rem; }
  .s-slot { background: var(--ok-bg); color: var(--ok); font-weight: 700; font-size: .9rem; padding: .75rem 1rem; border-radius: 8px; }

  footer { text-align: center; color: var(--fg-muted); font-size: .7rem; margin-top: .5rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="badge">면접 일정 조율</div>
    <h1>면접 시간을 선택해 주세요</h1>
    <p>아래 일정 중 가능한 시간을 하나 선택해 주세요.<br>먼저 선택하신 분께 해당 시간이 배정됩니다.</p>
  </div>

  <div class="card" id="slotsCard">
    <div class="card-ttl">면접 가능 일정</div>
    <div id="slotsList"><div class="row-msg">일정을 불러오는 중…</div></div>
  </div>

  <div class="card" id="formCard">
    <div class="card-ttl">지원자 정보</div>
    <div class="fpad">
      <div class="field">
        <label for="nm">이름 *</label>
        <input id="nm" type="text" placeholder="홍길동" autocomplete="name">
      </div>
      <div class="field">
        <label for="ct">연락처 (선택)</label>
        <input id="ct" type="tel" placeholder="010-0000-0000">
      </div>
      <div id="alertBox"></div>
      <button class="btn" id="submitBtn" disabled>면접 일정 신청하기</button>
    </div>
  </div>

  <footer>선착순 배정 · 중복 선택 불가</footer>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyJscc5xVeJ-cXKT6XyIGjSOanvnWz5cGFOb1BGL8B18uxd97QreAc3YmsSGert5K6RuA/exec';

  let slots = [], sel = null, busy = false;

  // JSONP 호출 (CORS 우회)
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = '__cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        cleanup(); reject(new Error('timeout'));
      }, 15000);
      function cleanup() {
        clearTimeout(timer);
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('load error')); };
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
      document.head.appendChild(script);
    });
  }

  function setAlert(msg, type) {
    const el = document.getElementById('alertBox');
    if (!msg) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    if (type === 'err') setTimeout(() => { el.innerHTML = ''; }, 5000);
  }

  function sync() {
    document.getElementById('submitBtn').disabled =
      !sel || !document.getElementById('nm').value.trim() || busy;
  }

  function render() {
    const list = document.getElementById('slotsList');
    if (!slots.length) { list.innerHTML = '<div class="row-msg">등록된 일정이 없습니다.</div>'; return; }

    list.innerHTML = '';
    slots.forEach(s => {
      const cls = s.booked ? 'taken' : sel === s.id ? 'selected' : 'available';
      const tagCls = s.booked ? 'tag-taken' : sel === s.id ? 'tag-sel' : 'tag-ok';
      const tagTxt = s.booked ? '마감' : sel === s.id ? '선택됨' : '신청가능';

      const div = document.createElement('div');
      div.className = `slot ${cls}`;
      div.innerHTML = `
        <div class="dot"></div>
        <div class="slot-info"><div class="slot-label">${s.label}</div></div>
        <span class="tag ${tagCls}">${tagTxt}</span>`;
      if (!s.booked) {
        div.addEventListener('click', () => { sel = s.id; setAlert('', ''); render(); sync(); });
      }
      list.appendChild(div);
    });
    sync();
  }

  function showSuccess(label, name) {
    document.getElementById('slotsCard').style.display = 'none';
    document.getElementById('formCard').innerHTML = `
      <div class="success">
        <div class="s-icon">✅</div>
        <h2>신청이 완료되었습니다</h2>
        <p>${name}님, 아래 일정으로 면접을 진행해 드립니다.<br>일정 변경이 필요하시면 담당자에게 문의해 주세요.</p>
        <div class="s-slot">${label}</div>
      </div>`;
    document.querySelector('footer').style.display = 'none';
  }

  document.getElementById('nm').addEventListener('input', sync);

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const name = document.getElementById('nm').value.trim();
    const contact = document.getElementById('ct').value.trim();
    if (!name || !sel || busy) return;

    const slot = slots.find(s => s.id === sel);
    if (slot && slot.booked) {
      setAlert('방금 다른 분이 선택하셨습니다. 다른 시간을 선택해 주세요.', 'err');
      sel = null; render(); return;
    }

    busy = true;
    const btn = document.getElementById('submitBtn');
    btn.textContent = '신청 중…'; sync();

    try {
      const url = `${GAS_URL}?action=book&slotId=${encodeURIComponent(sel)}&name=${encodeURIComponent(name)}&contact=${encodeURIComponent(contact)}`;
      const data = await jsonp(url);
      if (data.ok) {
        showSuccess(data.label, name);
      } else {
        setAlert(data.msg, 'err');
        sel = null; busy = false;
        btn.textContent = '면접 일정 신청하기';
        loadSlots();
      }
    } catch(e) {
      setAlert('오류가 발생했습니다. 다시 시도해 주세요.', 'err');
      busy = false; btn.textContent = '면접 일정 신청하기'; sync();
    }
  });

  async function loadSlots() {
    try {
      slots = await jsonp(`${GAS_URL}?action=slots`);
      render();
    } catch(e) {
      document.getElementById('slotsList').innerHTML =
        '<div class="row-msg">일정을 불러오지 못했습니다.<br>페이지를 새로 고침해 주세요.</div>';
    }
  }

  loadSlots();
</script>
</body>
</html>
